name: Application contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python package and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --frozen --extra api --extra dev
      - name: Run repository tests
        run: uv run pytest -q
      - name: Run network-free adversarial audit
        run: uv run humorvibes adversarial
      - name: Build wheel
        run: uv build --wheel

  container:
    name: Container build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render Compose configuration
        run: docker compose -f compose.yaml config --quiet
      - name: Lint and render Helm chart
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work \
            alpine/helm:4.2.0@sha256:af08f75a3130d666a50b9fc150f40987ef20b885cf67659aabf4b83a5f2c5501 \
            lint deploy/helm/humorvibes
          docker run --rm -v "$PWD:/work:ro" -w /work \
            alpine/helm:4.2.0@sha256:af08f75a3130d666a50b9fc150f40987ef20b885cf67659aabf4b83a5f2c5501 \
            template ci deploy/helm/humorvibes >/dev/null
      - name: Build and start hardened profile
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down --remove-orphans' EXIT
          docker compose up --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"texts":["container contract"]}' \
            http://127.0.0.1:8080/v1/embed
      - name: Run adversarial audit inside image
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,size=64m,mode=1777
          --cap-drop=ALL --security-opt=no-new-privileges
          --entrypoint humorvibes humorvibes-research:0.4.0 adversarial
