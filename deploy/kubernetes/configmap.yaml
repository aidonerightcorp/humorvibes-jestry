apiVersion: v1
kind: ConfigMap
metadata:
  name: humorvibes-config
data:
  HUMORVIBES_LLM_DEFAULT: offline
  HUMORVIBES_EMBEDDING_DEFAULT: hash:128
  HUMORVIBES_OLLAMA_MODELS: gemma3:4b
  HUMORVIBES_OLLAMA_EMBED_MODELS: embeddinggemma,qwen3-embedding,all-minilm
  HUMORVIBES_MAX_REQUEST_BYTES: "1000000"
  HUMORVIBES_MAX_RESPONSE_BYTES: "10000000"
  HUMORVIBES_MAX_BATCH_ITEMS: "64"
  HUMORVIBES_RATE_LIMIT_PER_MINUTE: "600"
  HUMORVIBES_STRICT_READINESS: "false"
