services:
  api:
    environment:
      OLLAMA_HOST: http://ollama:11434
      HUMORVIBES_OLLAMA_MODELS: "${OLLAMA_MODEL:-gemma3:4b}"
      HUMORVIBES_OLLAMA_EMBED_MODELS: "${OLLAMA_EMBED_MODEL:-embeddinggemma}"
      HUMORVIBES_LLM_DEFAULT: "ollama:${OLLAMA_MODEL:-gemma3:4b}"
      HUMORVIBES_EMBEDDING_DEFAULT: "ollama:${OLLAMA_EMBED_MODEL:-embeddinggemma}"
    depends_on:
      model-loader:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.32.4
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  model-loader:
    image: ollama/ollama:0.32.4
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$${OLLAMA_MODEL}"
        ollama pull "$${OLLAMA_EMBED_MODEL}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma3:4b}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-embeddinggemma}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-data:
