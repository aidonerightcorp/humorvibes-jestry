[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "humorvibes-research"
version = "0.8.0"
description = "Deployable integrations and API for the Humor Genome Wave 2 research project"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "HumorVibes contributors"}]
license = "Apache-2.0"
keywords = ["gemma", "humor-research", "ollama", "embeddings", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
local-embeddings = [
  "sentence-transformers>=3,<6",
]
multimodal = [
  "pillow>=10,<13",
]
telemetry = [
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
dev = [
  "httpx2>=2.9,<3",
  "kaggle>=1.7",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "pytest>=8",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "streamlit>=1.36",
]

[project.scripts]
humorvibes = "humorvibes.cli:main"
humorvibes-api = "humorvibes.api:run"

[tool.setuptools]
packages = ["humorvibes"]
py-modules = ["formats", "humor_mesh", "mesh_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
